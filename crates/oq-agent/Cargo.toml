[package]
name = "oq-agent"
description = "The host agent behind quanterdeck: systemd units, the trader's control port, logs, releases and alerts, as its own user"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
oq-deck-core.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["net", "io-util", "time"] }
ureq = "3.4"

[dev-dependencies]
tempfile = "3"
