name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The framework's own floor, 1.89, which it now declares honestly:
      # it uses File::try_lock, stable from 1.89. The deck needs nothing
      # newer of its own.
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fixtures:
    name: Fixtures match the writer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The run fixtures are generated by the framework's own writer. If
      # the format moves, regenerating them here produces a diff, and the
      # console finds out in CI rather than against a real directory.
      - run: cargo run -p oq-deck-core --example make_fixtures
      - run: git diff --exit-code examples/fixtures/runs

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  secrets:
    name: No secrets or deployment details
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This console is pointed at production systems. A credential or a
      # host that reaches the repository is not a lint failure, it is an
      # incident, so the check runs on every push rather than on release.
      - name: Scan for credentials and hosts
        run: |
          set -euo pipefail
          patterns='(api_?secret|private_?key|BEGIN [A-Z ]*PRIVATE KEY|[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]{2,5})'
          # A loopback address in a README is how you tell someone where
          # the console listens. A routable one is a deployment detail.
          allowed='(127\.0\.0\.1|0\.0\.0\.0|localhost)'
          hits=$(grep -rInE "$patterns" \
                   --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target . \
                 | grep -vE "$allowed" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::possible credential or deployment detail committed"
            exit 1
          fi
          echo "clean"
