name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest

  adapter-boundary:
    name: Adapters carry no dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/check-adapter-deps.sh

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  secrets:
    name: No secrets or deployment details
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This console is pointed at production systems. A credential or a
      # host that reaches the repository is not a lint failure, it is an
      # incident, so the check runs on every push rather than on release.
      - name: Scan for credentials and hosts
        run: |
          set -euo pipefail
          patterns='(api_?secret|private_?key|BEGIN [A-Z ]*PRIVATE KEY|[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]{2,5})'
          # A loopback address in a README is how you tell someone where
          # the console listens. A routable one is a deployment detail.
          allowed='(127\.0\.0\.1|0\.0\.0\.0|localhost)'
          hits=$(grep -rInE "$patterns" \
                   --exclude-dir=.git --exclude-dir=node_modules . \
                 | grep -vE "$allowed" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::possible credential or deployment detail committed"
            exit 1
          fi
          echo "clean"
