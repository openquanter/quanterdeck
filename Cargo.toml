[workspace]
resolver = "3"
members = ["crates/oq-deck-core", "crates/oq-deck", "crates/oq-agent"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"  # the framework's floor: see AGENTS.md
license = "Apache-2.0"
repository = "https://github.com/openquanter/quanterdeck"

[workspace.dependencies]
oq-deck-core = { path = "crates/oq-deck-core" }

# The framework, pinned to a commit rather than floated. A console that
# reads a run file has to agree with the writer about what a run file is,
# and "whatever main was that morning" is not an agreement.
oq-parity = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }
oq-data = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }
oq-engine = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }
oq-types = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }
oq-live = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }
oq-gateway = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }
oq-journal = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }
oq-backtest = { git = "https://github.com/openquanter/openquanter", rev = "b66911d" }

argon2 = "0.5"
axum = "0.8"
base32 = "0.5"
hmac = "0.12"
rand = "0.9"
sha1 = "0.10"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
